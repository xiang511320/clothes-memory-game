<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>货品编码练习系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f2f4f6;padding:15px;max-width:480px;margin:0 auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:#333}
.card{background:#fff;border-radius:20px;padding:25px 22px;box-shadow:0 6px 20px rgba(0,0,0,0.08);position:relative;margin-bottom:12px}
.goods-box{text-align:center;margin:10px 0 25px}
.goods-label{font-size:14px;color:#666;margin-bottom:6px}
.goods-no{font-size:24px;font-weight:700;color:#111;letter-spacing:1px}
.group{margin-bottom:20px}
.label{font-size:14px;color:#666;margin-bottom:8px;padding-left:4px}
.btn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{padding:13px 6px;border:1px solid #e1e4e8;border-radius:12px;background:#fff;font-size:15px;color:#333;cursor:pointer;transition:all 0.2s}
.btn:hover{border-color:#c0c4cc}
.btn.correct{background:#00c48c;color:#fff;border-color:#00c48c}
.btn.wrong{background:#ff4d4f;color:#fff;border-color:#ff4d4f}
.btn:disabled{opacity:0.7}

.nav{display:flex;gap:8px;margin-bottom:12px}
.nav button{flex:1;padding:12px;border-radius:12px;border:none;background:#fff;color:#333}

.tools{display:flex;gap:8px;margin-bottom:12px}
.tools button{flex:1;padding:10px;border-radius:12px;border:none;background:#fff;color:#333;font-size:14px}

.score-box{display:flex;gap:10px;margin-bottom:12px}
.score-item{flex:1;background:#f7f8fa;padding:10px;border-radius:12px;text-align:center}
.score-item .num{font-size:18px;font-weight:700;color:#333}
.score-item .text{font-size:12px;color:#999;margin-top:2px}

.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:12px;font-size:16px;display:none;z-index:99}
.wrong-box{display:none;background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,0.08)}
.wrong-box h4{margin-bottom:10px;font-size:16px}
.wrong-item{padding:10px;border-bottom:1px solid #eee;font-size:14px}
.wrong-item:last-child{border-bottom:none}
</style>
</head>
<body>

<div class="top-bar">
  <div>⏱ 用时：<span id="time">00:00</span></div>
  <div>🎯 正确率：<span id="rate">0%</span></div>
</div>

<div class="score-box">
  <div class="score-item"><div class="num" id="score">0</div><div class="text">总分</div></div>
  <div class="score-item"><div class="num" id="totalQ">0</div><div class="text">答题数</div></div>
</div>

<div class="nav">
  <button id="prev">⬅️ 上一题</button>
  <button id="skip">⏭️ 跳过此题</button>
  <button id="next" style="display:none">✅ 下一题</button>
</div>

<div class="tools">
  <button id="showWrong">📋 错题本</button>
  <button id="exportScore">📤 导出成绩</button>
</div>

<div class="card">
  <div class="goods-box">
    <div class="goods-label">当前货号</div>
    <div class="goods-no" id="goodsNo"></div>
  </div>

  <div class="group">
    <div class="label">色号</div>
    <div class="btn-grid" id="cnGroup"></div>
  </div>
  <div class="group">
    <div class="label">颜色</div>
    <div class="btn-grid" id="colorGroup"></div>
  </div>
  <div class="group">
    <div class="label">类别</div>
    <div class="btn-grid" id="catGroup"></div>
  </div>
  <div class="group">
    <div class="label">吊牌价</div>
    <div class="btn-grid" id="priceGroup"></div>
  </div>
</div>

<div class="wrong-box" id="wrongBox">

  <div id="wrongList"></div>
</div>

<div class="feedback" id="feedback"></div>

// 全局状态
let history = [];
let histIndex = -1;
let current = null;

let correct = { cn: false, color: false, cat: false, price: false };
let score = 0;
let total = 0;
let startTime = Date.now();
let wrongList = [];

const $ = id => document.getElementById(id);
const qs = (sel, p) => (p || document).querySelectorAll(sel);

// 工具
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function getOther(prop, cnt) {
  const s = new Set();
  while (s.size < cnt) {
    const item = colorData[Math.floor(Math.random() * colorData.length)];
    if (item[prop] !== current[prop]) s.add(item[prop]);
  }
  return [...s];
}
function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}
function showFeedback(text) {
  const el = $("feedback");
  el.textContent = text;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 800);
}

// 统计
function renderStats() {
  $("score").textContent = score;
  $("totalQ").textContent = total;
  const rate = total ? Math.round(score / total * 100) : 0;
  $("rate").textContent = rate + "%";
  $("time").textContent = formatTime(Date.now() - startTime);
}

// 渲染一组选项
function renderGroup(elId, key, ans) {
  const el = $(elId);
  el.innerHTML = "";
  const opts = shuffle([ans, ...getOther(key, 2)]);
  opts.forEach(v => {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = v;
    b.onclick = () => pick(key, v);
    el.appendChild(b);
  });
}

// 加载当前题目
function loadQuestion(q) {
  current = q;
  correct = { cn: false, color: false, cat: false, price: false };
  $("goodsNo").textContent = current.en;
  renderGroup("cnGroup", "cn", current.cn);
  renderGroup("colorGroup", "color", current.color);
  renderGroup("catGroup", "cat", current.category);
  renderGroup("priceGroup", "price", current.price);
  $("next").style.display = "none";
}

// 选择答案（核心：错了不锁组，可重选）
function pick(key, val) {
  const btns = $(`${key}Group`).querySelectorAll(".btn");
  btns.forEach(b => b.classList.remove("correct", "wrong"));

  if (val === current[key]) {
    correct[key] = true;
    btns.forEach(b => {
      if (b.textContent == val) b.classList.add("correct");
    });
    showFeedback("✅ 正确");
  } else {
    btns.forEach(b => {
      if (b.textContent == val) b.classList.add("wrong");
    });
    showFeedback("❌ 再试试");
    const exist = wrongList.some(x => x.en == current.en);
    if (!exist) wrongList.push(current);
  }

  if (correct.cn && correct.color && correct.cat && correct.price) {
    score++;
    total++;
    renderStats();
    $("next").style.display = "block";
  }
}

// 新题目
function newQuestion() {
  const q = colorData[Math.floor(Math.random() * colorData.length)];
  history = history.slice(0, histIndex + 1);
  history.push(q);
  histIndex++;
  loadQuestion(q);
}

// 上一题
$("prev").onclick = () => {
  if (histIndex <= 0) return showFeedback("🔙 已经是第一题");
  histIndex--;
  loadQuestion(history[histIndex]);
};

// 跳过
$("skip").onclick = () => {
  total++;
  renderStats();
  newQuestion();
};

// 下一题
$("next").onclick = newQuestion;

// 错题本
$("showWrong").onclick = () => {
  const box = $("wrongBox");
  if (box.style.display == "block") { box.style.display = "none"; return; }
  box.style.display = "block";
  if (wrongList.length === 0) {
    $("wrongList").innerHTML = "<div class='wrong-item'>暂无错题</div>";
    return;
  }
  $("wrongList").innerHTML = wrongList.map((w,i)=>`
    <div class='wrong-item'>${i+1}. ${w.en} | ${w.cn} | ${w.color} | ${w.category} | ${w.price}元</div>
  `).join('');
};

// 导出
$("exportScore").onclick = () => {
  const content = [
    ["货品练习成绩"],
    ["导出时间", new Date().toLocaleString()],
    ["总答题", total], ["正确", score],
    ["正确率", (total ? Math.round(score/total*100) : 0)+"%"],
    [],["货号","色号","颜色","类别","吊牌价"],
    ...wrongList.map(w=>[w.en,w.cn,w.color,w.category,w.price])
  ].map(r=>r.join(',')).join('\n');
  const blob = new Blob([content], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "货品练习成绩.csv";
  a.click();
  showFeedback("📤 导出成功");
};

// 开始
newQuestion();
renderStats();
setInterval(renderStats, 1000);
</script>
